<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth Intelligence Platform — Forest Eyes</title>
  <meta name="description" content="Planetary Forest Intelligence: Forest Eyes (Deforestation, 3D Earth & Tree Planner) with DATA (AI assessment)." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>" />

  <!-- Google Fonts: Inter, Outfit, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: 'Inter', system-ui, sans-serif; }

    /* Top control bar */
    .top-bar {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10000;
      height: 42px; display: flex; align-items: center; gap: 10px;
      padding: 4px 10px; border-radius: 12px;
      background: rgba(10, 16, 30, 0.88); border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      font: 600 13px/1 'Inter', system-ui, sans-serif; color: #e2e8f0; white-space: nowrap;
    }
    .platform-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(5, 150, 105, 0.25); border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399; font-weight: 700; font-size: 13px;
    }
    .lens-check {
      display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 14px; border-radius: 8px;
      cursor: pointer; font-size: 13px; font-weight: 600; color: #94a3b8; user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.08); transition: color .2s, border-color .2s, background .2s;
    }
    .lens-check:hover { color: #f8fafc; border-color: rgba(56, 189, 248, 0.4); }
    .lens-check input { accent-color: #38bdf8; width: 15px; height: 15px; margin: 0; cursor: pointer; }
    .lens-check:has(input:checked) { color: #38bdf8; border-color: rgba(56, 189, 248, 0.6); background: rgba(56, 189, 248, 0.14); }
    .lens-sub { font-weight: 500; opacity: .75; font-size: 11px; }

    @media (max-width: 900px) { .top-bar { top: auto; bottom: 12px; } }

    .viewports-container { width: 100vw; height: 100vh; position: relative; }
    .viewport-frame-wrapper { width: 100%; height: 100%; position: absolute; inset: 0; }
    .viewport-iframe { width: 100%; height: 100%; border: 0; display: block; }

    .hazard-lens-overlay { position: fixed; inset: 0; z-index: 9999; background: #050811; }
    .hazard-lens-overlay[hidden] { display: none; }
    .hazard-lens-overlay iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>

  <!-- Top bar: Forest Eyes identifier + DATA toggle -->
  <div class="top-bar" id="top-bar">
    <div class="platform-tag" title="Forest Eyes Platform Active">
      <span>🌳 Forest Eyes</span>
    </div>
    <label class="lens-check" title="Reads satellite images with terrain and forest data (Esc to close)">
      <input type="checkbox" id="lens-toggle" />
      <span>DATA</span>
    </label>
  </div>

  <!-- Main Viewport: Forest Eyes -->
  <main class="viewports-container" id="viewports-container">
    <div class="viewport-frame-wrapper active" id="viewport-forest">
      <iframe class="viewport-iframe" id="frame-forest" src="forest-eyes/index.html" title="Forest Eyes Platform" loading="eager"></iframe>
    </div>
  </main>

  <!-- DATA overlay -->
  <div class="hazard-lens-overlay" id="hazard-lens-overlay" hidden>
    <iframe id="hazard-lens-frame" title="DATA"></iframe>
  </div>

  <script>
    (function () {
      const overlay = document.getElementById('hazard-lens-overlay');
      const frame = document.getElementById('hazard-lens-frame');
      const toggle = document.getElementById('lens-toggle');
      window.currentPlatformMode = 'forest';

      function setLens(on) {
        if (on && !frame.src) frame.src = 'hazard/index.html?mode=forest';
        else if (on) frame.contentWindow?.postMessage({ type: 'hazard-mode', mode: 'forest' }, location.origin);
        overlay.hidden = !on;
        toggle.checked = on;
      }
      window.setHazardLens = setLens;
      toggle.addEventListener('change', () => setLens(toggle.checked));
      document.addEventListener('keydown', e => { if (e.key === 'Escape') setLens(false); });
      window.addEventListener('message', e => {
        if (e.origin === location.origin && e.data?.type === 'close-hazard-lens') setLens(false);
      });

      // Deep links: #lens opens the Hazard Lens
      if (location.hash === '#lens') setLens(true);

      // Modal blur handling from iframe
      window.addEventListener('message', (e) => {
        if (e.origin === location.origin && e.data && e.data.type === 'APP_MODAL') {
          const bar = document.getElementById('top-bar');
          if (bar) {
            bar.style.visibility = e.data.open ? 'hidden' : '';
            bar.toggleAttribute('inert', !!e.data.open);
          }
        }
      });
    })();
  </script>
</body>
</html>
